<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: flow 4s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 10, 10;
      animation: flowReverse 3.5s linear infinite;
    }
    .pulse-circle {
      animation: pulse 2.5s ease-in-out infinite alternate;
    }
    .pulse-node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }
    .beacon {
      animation: beacon 2s ease-out infinite;
    }

    @keyframes flow {
      from { stroke-dashoffset: 240; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowReverse {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 200; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes nodePulse {
      0% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.8)); }
    }
    @keyframes beacon {
      0% { r: 6px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Decorative Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Network / Routing Streams (Background Canvas) -->
  <g opacity="0.7">
    <!-- Left Ingress Connection Lines -->
    <path d="M 60 210 Q 200 130 350 210" fill="none" stroke="#0ea5e9" stroke-width="2.5" class="flow-line" opacity="0.6"/>
    <path d="M 60 210 Q 180 290 350 210" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" opacity="0.5"/>

    <!-- Right Egress Routing Channels to Provider Nodes -->
    <path d="M 850 210 Q 980 100 1120 110" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
    <path d="M 850 210 Q 1000 180 1120 180" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line-reverse" />
    <path d="M 850 210 Q 1000 240 1120 250" fill="none" stroke="#a855f7" stroke-width="2.5" class="flow-line" />
    <path d="M 850 210 Q 980 320 1120 320" fill="none" stroke="#f43f5e" stroke-width="2" class="flow-line-reverse" />

    <!-- External Endpoints Nodes -->
    <!-- Input Client Node -->
    <circle cx="60" cy="210" r="14" fill="#0284c7" opacity="0.8" />
    <circle cx="60" cy="210" r="6" fill="#e0f2fe" />
    <circle cx="60" cy="210" r="6" fill="none" stroke="#38bdf8" stroke-width="2" class="beacon" />
    <text x="60" y="240" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Client Request</text>

    <!-- Provider Target Nodes -->
    <!-- Node 1: Fast Frontier LLM -->
    <circle cx="1120" cy="110" r="12" fill="#0369a1" />
    <circle cx="1120" cy="110" r="5" fill="#38bdf8" />
    <text x="1105" y="90" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="end" font-family="sans-serif">OpenAI / GPT-4o</text>

    <!-- Node 2: Reasoning Model -->
    <circle cx="1120" cy="180" r="12" fill="#4338ca" />
    <circle cx="1120" cy="180" r="5" fill="#818cf8" />
    <text x="1105" y="172" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="end" font-family="sans-serif">Anthropic / Claude</text>

    <!-- Node 3: Low Cost Model -->
    <circle cx="1120" cy="250" r="12" fill="#6d28d9" />
    <circle cx="1120" cy="250" r="5" fill="#c084fc" />
    <text x="1105" y="245" fill="#d8b4fe" font-size="12" font-weight="600" text-anchor="end" font-family="sans-serif">Google / Gemini</text>

    <!-- Node 4: Self-Hosted vLLM / Ollama -->
    <circle cx="1120" cy="320" r="12" fill="#9f1239" />
    <circle cx="1120" cy="320" r="5" fill="#fb7185" />
    <text x="1105" y="315" fill="#fda4af" font-size="12" font-weight="600" text-anchor="end" font-family="sans-serif">Local vLLM / Ollama</text>
  </g>

  <!-- Center Card Backdrop (guarantees text remains in clear foreground) -->
  <rect x="220" y="55" width="760" height="310" rx="20" fill="#0b1120" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" class="pulse-node" />

  <!-- Center Glowing Header Icon -->
  <g transform="translate(600, 105)">
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#subtleGlow)"/>
    <!-- Router Icon Symbol -->
    <path d="M -12 -6 L 0 -14 L 12 -6 L 12 8 L 0 16 L -12 8 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 0 -14 L 0 16" stroke="#818cf8" stroke-width="2"/>
    <path d="M -12 -6 L 0 2 L 12 -6" stroke="#c084fc" stroke-width="2" fill="none"/>
    <circle cx="0" cy="2" r="3" fill="#38bdf8"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="600" y="185" text-anchor="middle" fill="url(#titleGrad)" font-size="44" class="title-text" filter="url(#subtleGlow)">
    Awesome LLM Router
  </text>

  <text x="600" y="222" text-anchor="middle" fill="url(#subGrad)" font-size="17" class="sub-text">
    Curated Hub of Intelligent LLM Routers, AI Gateways &amp; Inference Cost Optimizers
  </text>

  <text x="600" y="248" text-anchor="middle" fill="#94a3b8" font-size="13" class="sub-text">
    Dynamic Model Routing • Provider Failover • Spend Guardrails • Unified OpenAI-Compatible APIs
  </text>

  <!-- Modern Interactive-Style Feature Pills in Banner Foreground -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Cost Optimization -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="5" fill="#38bdf8"/>
      <text x="28" y="22" fill="#e0f2fe" class="badge-text">Cost Reduction</text>
    </g>

    <!-- Pill 2: Auto-Failover -->
    <g transform="translate(-155, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="5" fill="#818cf8"/>
      <text x="28" y="22" fill="#ede9fe" class="badge-text">Auto-Failover</text>
    </g>

    <!-- Pill 3: Low Latency -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="5" fill="#c084fc"/>
      <text x="28" y="22" fill="#fae8ff" class="badge-text">&lt;10ms Overhead</text>
    </g>

    <!-- Pill 4: Open Standards -->
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#0f172a" stroke="#db2777" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="5" fill="#f472b6"/>
      <text x="28" y="22" fill="#fce7f3" class="badge-text">Unified API Mesh</text>
    </g>
  </g>
</svg>
